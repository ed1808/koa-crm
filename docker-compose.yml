services:
  postgres:
    image: postgres:18-alpine
    container_name: koa_crm_postgres_server
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koa_crm}
      POSTGRES_USER: ${POSTGRES_USER:-koa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koa_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: koa_crm_rabbitmq_server
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-koa_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-koa_rabbit_2026}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
